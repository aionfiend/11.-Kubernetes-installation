name: Kubernetes Cluster Monitor (Via Bastion Tunnel)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor-pods:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.4'

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube

          # Записываем конфиг напрямую (убран слэш перед знаками доллара)
          cat << 'EOF' > ~/.kube/config
          ${{ secrets.KUBECONFIG_DATA }}
          EOF

          # Принудительно настраиваем kubectl смотреть на локальный порт туннеля 6444
          kubectl config set-cluster k8s --server=https://127.0.0.1:6444
          kubectl config set-cluster k8s --insecure-skip-tls-verify=true
      

      - name: Establish SSH Tunnel through Bastion
        env:
          B_HOST: \${{ secrets.BASTION_HOST }}
          B_USER: \${{ secrets.BASTION_USER }}
          B_PORT: \${{ secrets.BASTION_PORT }}
          R_IP: \${{ secrets.REMOTE_K8S_IP }}
        run: |
          mkdir -p ~/.ssh
          
          cat << 'EOF' > ~/.ssh/id_rsa
          \${{ secrets.BASTION_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          
          echo "=== Сканируем ключи хоста бастиона на порту \$B_PORT ==="
          # Добавлен флаг -p для указания кастомного порта при сканировании ключей
          ssh-keyscan -p "\(B_PORT" -H "\)B_HOST" >> ~/.ssh/known_hosts
          
          echo "=== Запуск SSH-туннеля к бастиону ==="
          # Добавлен флаг -p \$B_PORT для подключения SSH к нестандартному порту
          ssh -f -N -p "\(B_PORT" -L 6444:"\)R_IP":6443 "\(B_USER"@"\)B_HOST" -i ~/.ssh/id_rsa
          
          # Ожидаем инициализации соединения
          sleep 5
          
          # Проверяем, открылся ли порт локально на воркере
          if nc -z 127.0.0.1 6444; then
            echo "::notice::✅ SSH-туннель успешно поднят через порт \$B_PORT! Порт 6444 открыт и готов к работе."
            echo "=== Связь с кластером установлена ==="
          else
            echo "::error::❌ Ошибка: Не удалось установить SSH-туннель. Проверьте параметры сети."
            exit 1
          fi

      - name: Check Pods Status
        id: check_pods
        run: |
          echo "=== Проверка статуса подов во всех пространствах имен ==="
          
          # Фильтруем проблемные поды
          FAILED_PODS=\$(kubectl get pods -A --context k8s --no-headers | awk '\$4 !~ /Running|Completed/ {print \$1 "/" \$2 " Status: " \$4}')
          
          if [ -n "\$FAILED_PODS" ]; then
            echo "::error::Обнаружены проблемные поды в кластере!"
            echo "----------------------------------------"
            echo "\$FAILED_PODS"
            echo "----------------------------------------"
            echo "FAILED_COUNT=\$(echo "\(FAILED_PODS" \vert{} wc -l)" >> \)GITHUB_ENV
            exit 1
          else
            echo "Все поды работают в штатном режиме (Running/Completed)."
          fi

      - name: Create GitHub Summary Notification
        if: failure()
        run: |
          echo "### ⚠️ Сбой в кластере Kubernetes!" >> \$GITHUB_STEP_SUMMARY
          echo "Обнаружено проблемных подов: \({{ env.FAILED_COUNT }}" >> \)GITHUB_STEP_SUMMARY
          echo "Пожалуйста, откройте k9s или выполните \`kubectl get pods -A\` для диагностики." >> \$GITHUB_STEP_SUMMARY
