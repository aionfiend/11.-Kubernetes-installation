name: Kubernetes Cluster Monitor (Via Bastion Tunnel)

on:
  schedule:
    # Автоматический запуск каждые 15 минут
    - cron: '*/15 * * * *'
  # Возможность ручного запуска из панели управления GitHub Actions
  workflow_dispatch:

jobs:
  monitor-pods:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.4'

      - name: Configure Kubeconfig
        run: |
          mkdir -p ~/.kube

          # Записываем конфиг напрямую как текст, игнорируя спецсимволы
          cat << 'EOF' > ~/.kube/config
          ${{ secrets.KUBECONFIG_DATA }}
          EOF

          # Настраиваем kubectl смотреть на локальный порт туннеля
          kubectl config set-cluster k8s --server=https://127.0.0.1:6444
          kubectl config set-cluster k8s --insecure-skip-tls-verify=true

      - name: Establish SSH Tunnel through Bastion
        env:
          B_HOST: ${{ secrets.BASTION_HOST }}
          B_USER: ${{ secrets.BASTION_USER }}
          R_IP: ${{ secrets.REMOTE_K8S_IP }}
        run: |
          # Создаем директорию для SSH
          mkdir -p ~/.ssh

          # Передаем ключ, используя heredoc во избежание проблем с многострочностью
          cat << 'EOF' > ~/.ssh/id_rsa
          ${{ secrets.BASTION_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa

          echo "=== Тестируем доступность бастиона ==="
          # Пытаемся получить ключ хоста с выводом ошибок в консоль
          ssh-keyscan -v -H "$B_HOST" >> ~/.ssh/known_hosts 2> keyscan_err.log || echo "keyscan failed"
          cat keyscan_err.log

          echo "=== Пробуем интерактивное SSH подключение ==="
          # Запускаем тестовое подключение с подробным логированием (-v), чтобы увидеть отказ
          ssh -v -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$B_USER"@"$B_HOST" "echo 'Проверка связи'" 2> ssh_debug.log || true

          # Выводим логи подключения на экран GitHub Actions
          cat ssh_debug.log

          # Завершаем шаг принудительно, чтобы вы могли проанализировать логи
          echo "::error::Анализ логов завершен. Пожалуйста, посмотрите текст выше."
          exit 1
      
      

      - name: Check Pods Status
        id: check_pods
        run: |
          echo "=== Проверка статуса подов во всех пространствах имен ==="
          
          # Фильтруем поды, исключая статусы Running и Completed
          FAILED_PODS=\$(kubectl get pods -A --context k8s --no-headers | awk '\$4 !~ /Running|Completed/ {print \$1 "/" \$2 " Status: " \$4}')
          
          if [ -n "\$FAILED_PODS" ]; then
            echo "::error::Обнаружены проблемные поды в кластере!"
            echo "----------------------------------------"
            echo "\$FAILED_PODS"
            echo "----------------------------------------"
          
            # Сохраняем количество упавших подов для вывода в сводку
            echo "FAILED_COUNT=\$(echo "\(FAILED_PODS" \vert{} wc -l)" >> \)GITHUB_ENV
          
            # Завершаем шаг с ошибкой, чтобы инициировать уведомление системы
            exit 1
          else
            echo "Все поды работают в штатном режиме (Running/Completed)."
          fi

      - name: Create GitHub Summary Notification
        if: failure()
        run: |
          echo "### ⚠️ Сбой в кластере Kubernetes!" >> \$GITHUB_STEP_SUMMARY
          echo "Обнаружено проблемных подов: \({{ env.FAILED_COUNT }}" >> \)GITHUB_STEP_SUMMARY
          echo "Пожалуйста, откройте k9s или выполните \`kubectl get pods -A\` для диагностики." >> \$GITHUB_STEP_SUMMARY

      - name: Send Alert Notification to Slack
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: all_aion_fr
          SLACK_COLOR: '#FF0000' # Красный цвет полосы сообщения
          SLACK_USERNAME: 'K8s Monitor Bot'
          SLACK_ICON: 'https://kubernetes.io'
          SLACK_TITLE: '⚠️ Критическая ошибка в кластере Kubernetes!'
          SLACK_MESSAGE: |
            В кластере зафиксировано падение подов!
            Проблемных подов обнаружено: ${{ env.FAILED_COUNT }}
            Ссылка на запуск пайплайна: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}
